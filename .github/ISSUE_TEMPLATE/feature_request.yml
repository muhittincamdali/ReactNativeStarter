name: Feature request
description: Suggest something the starter should include or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The app you are building and where the starter gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: The change you have in mind, and whether it belongs in the starter or in Examples/.
    validations:
      required: true
