name: Bug report
description: Something in the app, the API or the tooling does not work as described.
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From a fresh clone if you can. Include the request for an API problem.
      placeholder: |
        1. npm ci && npx expo start
        2. Press i, create an account
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS
        - Android
        - Web
        - API / server
        - Tooling (tests, lint, build, docs)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device or simulator and OS version, Node.js version, and the output of `npx expo-doctor`.
      render: text
    validations:
      required: true
  - type: markdown
    attributes:
      value: Report security issues privately, as described in SECURITY.md, not here.
