# Turns off "AutoFill Passwords and Passkeys" and "Suggest Strong Passwords" in the Settings app
# of a simulator. With them on, iOS takes over the password fields and drops text typed by
# Maestro. The switch positions match the iOS 27 Settings layout.
appId: com.apple.Preferences
---
- launchApp:
    stopApp: true
- tapOn: 'General'
- tapOn: 'AutoFill & Passwords'
- waitForAnimationToEnd
- runFlow:
    when:
      visible: 'AutoFill from:'
    commands:
      - tapOn:
          point: '84%,20%'
      - waitForAnimationToEnd
- tapOn:
    point: '84%,34%'
- waitForAnimationToEnd
- stopApp
